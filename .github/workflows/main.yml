name: Build Windows 32-bit

on:
  workflow_dispatch:

jobs:
  build-win32:
    name: Build for i686 Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: i686-pc-windows-msvc
        override: true

    - name: Setup vcpkg and install 32-bit dependencies
      run: |
        cd %GITHUB_WORKSPACE%
        git clone --depth 1 https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat -disableMetrics
        .\vcpkg install libvpx:x86-windows-static libyuv:x86-windows-static opus:x86-windows-static aom:x86-windows-static
      shell: cmd

    - name: Set environment variables
      run: |
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $GITHUB_ENV
        echo "VCPKG_FEATURE_FLAGS=-manifests" >> $GITHUB_ENV
      shell: bash

    - name: Build RustDesk 32-bit
      run: cargo build --target i686-pc-windows-msvc --release
      shell: bash
      env:
        VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    - name: Upload 32-bit EXE
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-win32
        path: target/i686-pc-windows-msvc/release/rustdesk.exe
